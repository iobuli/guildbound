[package]
name = "guildbound"
edition.workspace = true
version.workspace = true
publish.workspace = true

# Overhaul build: floor, voxel body, Avian physics body driven by sim::api, F3 overlay. No egui/HUD/Studio/F2.
[dependencies]
guildbound_sim = { path = "../sim" }
bevy = { version = "=0.19.1" }
avian3d = "=0.7.0"
gltf = { version = "=1.4.1", default-features = false, features = ["utils", "names"] }
serde_json = "1"
