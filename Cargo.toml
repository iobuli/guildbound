[workspace]
resolver = "3"
members = ["crates/sim", "crates/gbui", "crates/gbperf", "crates/game", "tools/gb_lab"]

[workspace.package]
edition = "2024"
version = "0.1.0"
publish = false

# Bevy's recommended dev profile: our code builds fast, dependencies run fast.
[profile.dev]
opt-level = 1
# Line tables only: backtraces keep file:line, and rustc needs far less memory for the game
# crate (full debuginfo ran a 16 GB Windows box out of memory).
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3

# Shipping build: whole-program thin LTO and one codegen unit (slower to build, faster to run).
[profile.release]
lto = "thin"
codegen-units = 1
